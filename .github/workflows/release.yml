name: Release Windows app
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify release version matches application
        shell: pwsh
        run: |
          [xml]$project = Get-Content MNTBloxAudio.App/MNTBloxAudio.App.csproj
          $version = $project.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag must match project version v$version" }
      - name: Test cache recovery and WPF layouts
        run: dotnet run --project MNTBloxAudio.Tests -c Release
      - name: Publish standalone executable
        run: dotnet publish MNTBloxAudio.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o publish
      - name: Publish GitHub release for automatic updates
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME publish/MNTBloxAudio.exe --verify-tag --generate-notes --title "MNTBloxAudio $env:GITHUB_REF_NAME"
